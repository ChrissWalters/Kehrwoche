[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kehrwoche"
version = "1.0.0"
description = "Self-hosted web app to organise shared households: chores, shopping list, shared expenses and a household feed"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Kehrwoche contributors" }]
keywords = ["household", "chores", "roommates", "shared-expenses", "self-hosted"]
classifiers = [
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "argon2-cffi>=23.1",
    # TLS: self-signed certificates for the home network (AP28).
    "cryptography>=43",
    "pillow>=10.4",
    # Multipart bodies: FastAPI needs it to accept an uploaded file.
    "python-multipart>=0.0.9",
    "pymysql>=1.1",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
# The instance administration inside the container.
kehrwoche-admin = "app.cli:main"

[project.urls]
Homepage = "https://github.com/kehrwoche/kehrwoche"
Source = "https://github.com/kehrwoche/kehrwoche"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["data/*.txt", "locales/*.json", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Makes "tests.…" importable no matter how pytest is started. Without it the console
# script fails where "python -m pytest" (which adds the working directory) succeeds.
pythonpath = ["."]
