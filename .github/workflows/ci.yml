name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and test (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        run: pytest -q

  databases:
    name: Migrations and tests (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mariadb
            url: mysql+pymysql://kehrwoche:kehrwoche@127.0.0.1:3306/kehrwoche
          - database: postgresql
            url: postgresql+psycopg://kehrwoche:kehrwoche@127.0.0.1:5432/kehrwoche

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: kehrwoche
          MARIADB_USER: kehrwoche
          MARIADB_PASSWORD: kehrwoche
          MARIADB_RANDOM_ROOT_PASSWORD: "1"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kehrwoche
          POSTGRES_USER: kehrwoche
          POSTGRES_PASSWORD: kehrwoche
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: ${{ matrix.url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # Proves the migration runs in both directions on this dialect, not just on SQLite.
      - name: Migrate up, down and up again
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      # `alembic check` runs in the SQLite job only: reflection of JSON and boolean
      # columns differs per dialect, so it would report differences that are not real.
      - name: Smoke test the full suite against ${{ matrix.database }}
        env:
          TEST_DATABASE_URL: ${{ matrix.url }}
        run: pytest -q
